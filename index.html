<!doctype html>
<html lang="tl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HandleVault Mail &amp; Wax Stamps</title>
  <style>
    :root {
      --bg: #0c111d;
      --panel: #131b2e;
      --panel-2: #19243d;
      --text: #eef2ff;
      --muted: #9aa7c7;
      --line: #283655;
      --gold: #f5c451;
      --crimson: #e05a70;
      --mint: #63dfb8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 18px 60px;
    }

    h1 { margin: 0 0 6px; font-size: 1.65rem; }
    .sub { margin: 0 0 22px; color: var(--muted); font-size: 0.95rem; }

    .section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .section h2 {
      margin: 0 0 12px;
      font-size: 1.05rem;
      color: var(--gold);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
    }

    .hv-stamp-card {
      text-align: left;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      color: var(--text);
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .hv-stamp-card:hover { transform: translateY(-2px); border-color: #6b82b8; }
    .hv-stamp-card.is-selected { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }

    .hv-stamp-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .hv-stamp-emoji-lg { font-size: 1.5rem; }
    .hv-stamp-price {
      font-size: 0.75rem;
      color: var(--mint);
      background: rgba(99, 223, 184, 0.1);
      border: 1px solid rgba(99, 223, 184, 0.35);
      padding: 3px 8px;
      border-radius: 999px;
    }

    .hv-stamp-title { font-weight: 700; font-size: 0.98rem; margin-bottom: 4px; }
    .hv-stamp-meta { font-size: 0.8rem; color: var(--muted); }

    .hv-stamp-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .hv-style-dashed-ink { border: 1.5px dashed var(--muted); background: rgba(255, 255, 255, 0.04); }
    .hv-style-wax-crimson { border: 2px solid var(--crimson); background: rgba(224, 90, 112, 0.14); }
    .hv-style-wax-gold { border: 2px solid var(--gold); background: rgba(245, 196, 81, 0.14); }
    .hv-style-custom-border { border: 2px solid var(--mint); background: rgba(99, 223, 184, 0.12); }

    .builder-form {
      display: grid;
      grid-template-columns: 110px 1fr 190px auto;
      gap: 10px;
      align-items: end;
    }

    @media (max-width: 720px) {
      .builder-form { grid-template-columns: 1fr; }
    }

    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }

    input, select, button.btn-primary {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      font-size: 0.92rem;
    }

    button.btn-primary {
      background: var(--gold);
      color: #131722;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    .hv-gumroad-flash {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(245, 196, 81, 0.12);
      border: 1px solid rgba(245, 196, 81, 0.45);
      margin-bottom: 18px;
    }

    .hv-gumroad-flash a {
      color: var(--gold);
      font-weight: 700;
      text-decoration: underline;
    }

    .hv-payload-note { margin-left: 10px; font-size: 0.82rem; color: var(--muted); }
    .hv-custom-notice p { margin: 8px 0 0; font-size: 0.88rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>HandleVault Mail &amp; Wax Stamps</h1>
    <p class="sub">Native Unicode emoji stamps para sa Mail, Invite, at 3D Mail (Free, ₱29 pack / ₱5 add-on local, ₱49+ custom, $1–$5+ abroad).</p>

    <div id="flashContainer" aria-live="polite"></div>

    <section class="section">
      <h2>Message Stamp Preview</h2>
      <div id="previewContainer"></div>
    </section>

    <section class="section">
      <h2>Standard &amp; Premium Stamps</h2>
      <div id="catalogContainer" class="grid"></div>
    </section>

    <section class="section">
      <h2>Custom Stamp Builder (custom.stamps)</h2>
      <div id="customContainer" class="grid" style="margin-bottom: 14px;"></div>

      <form id="customForm" class="builder-form">
        <div>
          <label for="customEmoji">Emoji</label>
          <input id="customEmoji" name="emoji" type="text" value="🎯" maxlength="8" />
        </div>
        <div>
          <label for="customTitle">Stamp Label</label>
          <input id="customTitle" name="title" type="text" placeholder="Hal. VIP Invite Seal" maxlength="32" />
        </div>
        <div>
          <label for="customStyle">Badge Style</label>
          <select id="customStyle" name="badge_style">
            <option value="custom-border">Custom Border</option>
            <option value="wax-crimson">Wax Crimson</option>
            <option value="wax-gold">Wax Gold</option>
            <option value="dashed-ink">Dashed Ink</option>
          </select>
        </div>
        <div>
          <button type="submit" class="btn-primary">Preview Custom</button>
        </div>
      </form>
    </section>
  </div>

  <script type="module">
    import { loadStampsCatalog, renderSplitStampSections, createCustomStampForPreview } from "./app.js";

    const catalogContainer = document.getElementById("catalogContainer");
    const customContainer = document.getElementById("customContainer");
    const previewContainer = document.getElementById("previewContainer");
    const flashContainer = document.getElementById("flashContainer");
    const customForm = document.getElementById("customForm");

    let stamps = [];
    let selectedStamp = null;

    function refreshUI() {
      renderSplitStampSections({
        catalogContainer,
        customContainer,
        previewContainer,
        flashContainer,
        stamps,
        selectedStamp
      });
    }

    function handleStampClick(event) {
      const card = event.target.closest("[data-stamp-id]");
      if (!card) return;
      const id = card.getAttribute("data-stamp-id");
      const found = stamps.find((item) => item.id === id);
      if (found) {
        selectedStamp = found;
        refreshUI();
      }
    }

    catalogContainer.addEventListener("click", handleStampClick);
    customContainer.addEventListener("click", handleStampClick);

    customForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const formData = new FormData(customForm);
      selectedStamp = createCustomStampForPreview({
        emoji: formData.get("emoji"),
        title: formData.get("title"),
        badge_style: formData.get("badge_style")
      });
      refreshUI();
    });

    try {
      stamps = await loadStampsCatalog("./stamps.json");
      selectedStamp = stamps[0] || null;
      refreshUI();
    } catch (err) {
      previewContainer.innerHTML = `<p style="color:#e05a70;">Hindi ma-load ang stamps.json: ${err.message}</p>`;
    }
  </script>
</body>
</html>
